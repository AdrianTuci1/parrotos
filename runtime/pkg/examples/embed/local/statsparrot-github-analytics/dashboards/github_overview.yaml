type: canvas
display_name: GitHub Overview

defaults:
  time_range: P4W
  comparison_mode: time

rows:
  - items:
      - kpi_grid:
          metrics_view: commits_metrics
          measures:
            - total_commits
            - total_additions
            - total_deletions
          comparison:
            - delta
            - percent_change
        width: 12
    height: 128px
  - items:
      - stacked_bar:
          metrics_view: commits_metrics
          title: Commits per day
          x:
            type: temporal
            field: day
            sort: -y
            limit: 30
          y:
            type: quantitative
            field: total_commits
            zeroBasedOrigin: true
          color: hsl(240,100%,67%)
        width: 12
    height: 320px
  - items:
      - stacked_bar:
          metrics_view: commits_metrics
          title: Commits by author
          x:
            field: author
            limit: 20
            sort: -y
            type: nominal
          y:
            field: total_commits
            type: quantitative
            zeroBasedOrigin: true
        width: 6
      - stacked_bar:
          metrics_view: commits_metrics
          title: Commits by repository
          x:
            field: repo
            limit: 20
            sort: -y
            type: nominal
          y:
            field: total_commits
            type: quantitative
            zeroBasedOrigin: true
        width: 6
    height: 320px
  - items:
      - table:
          metrics_view: commits_metrics
          title: Contributor activity
          columns:
            - author
            - repo
            - total_commits
            - total_additions
            - total_deletions
        width: 12
    height: 280px
