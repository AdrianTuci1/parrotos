<!doctype html>
<html lang="%lang%">
  <head>
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
    <!-- preloaded fonts -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/source-code/SourceCodePro-VariableFont_wght.ttf"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-Regular.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-Medium.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-SemiBold.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-Bold.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-ExtraBold.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta charset="utf-8" />
    <!-- Set the mobile viewport width -->
    <meta
      name="viewport"
      content="width=1024, initial-scale=1.0, user-scalable=yes"
    />
    <!-- Set the og image for thumbnail previews -->
    <meta
      property="og:image"
      content="https://storage.googleapis.com/prod-cdn.statsparrot.com/images/statsparrot-admin.png"
    />
    %sveltekit.head%
    <script>
      // Apply the stored theme before the first paint so a graphite session
      // never flashes the light palette while the app boots.
      (function () {
        try {
          if (location.pathname.indexOf("/-/embed") !== -1) return;
          var raw = localStorage.getItem("statsparrot:theme");
          var preference = "graphite";
          if (raw !== null) {
            try {
              preference = JSON.parse(raw) || "graphite";
            } catch (error) {
              preference = raw;
            }
          }
          var isDark =
            preference === "graphite" ||
            preference === "dark" ||
            (preference === "system" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
          if (preference === "graphite")
            document.documentElement.classList.add("graphite");
        } catch (error) {
          // localStorage can be unavailable in privacy modes.
        }
      })();
    </script>
  </head>

  <body data-sveltekit-preload-data="hover">
    <div>%sveltekit.body%</div>
    <div id="statsparrot-portal"></div>
  </body>
</html>
