# Cloudflare Worker for Statsparrot's telemetry ingest.
#
#   npx wrangler deploy            # from this directory
#   npx wrangler dev               # local worker; S3 calls still go to AWS
#   npx wrangler tail              # watch rejected batches in production
#
# The client batches events on disk and posts them here; the Worker writes one
# NDJSON object per batch into S3. There is no server to run and no request per
# event.

name = "statsparrot-telemetry"
main = "src/index.mjs"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[vars]
# The bucket is shared by the staticlabs projects; `statsparrot/telemetry` is
# this project's namespace, and the IAM writer is scoped to exactly that prefix.
AWS_REGION = "eu-central-1"
S3_BUCKET = "staticlabs-data"
S3_PREFIX = "statsparrot/telemetry"

# The ingest host. `telemetry.` is a new name in the `statsparrot.com` zone, so a
# custom domain claims it without a competing route.
[[routes]]
pattern = "telemetry.statsparrot.com"
custom_domain = true

# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are secrets and never appear in
# this file. Set them with:
#   npx wrangler secret put AWS_ACCESS_KEY_ID
#   npx wrangler secret put AWS_SECRET_ACCESS_KEY
#
# STATSPARROT_TELEMETRY_TOKEN is optional. Set it only if the endpoint needs to
# reject anonymous posts; the CLI sends no token today, so the endpoint accepts
# anonymous batches until the secret exists.
#   npx wrangler secret put STATSPARROT_TELEMETRY_TOKEN
